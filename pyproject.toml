[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wifisense"
version = "0.1.0"
description = "WiFi-based motion and human presence sensing with alarms"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
serial = ["pyserial>=3.5"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["wifisense*"]

[tool.setuptools.package-data]
wifisense = ["static/*", "static/fonts/*", "static/vendor/three/*", "static/vendor/three/addons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
