name: Docker tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify public configuration templates
        run: |
          test ! -f .env
          test "$(git ls-files data | wc -l)" -eq 1
          cp .env.example .env
          docker compose config --quiet
      - name: Demo page matches the UI
        run: python3 tools/build_demo.py --check
      - name: Build test image
        run: docker build --target test -t wifi-sense:test .
      - name: Run hardware-independent tests
        run: docker run --rm --network none wifi-sense:test
      - name: Lint
        run: docker run --rm --network none --entrypoint ruff wifi-sense:test check wifisense tests tools
      - name: Build runtime image
        run: docker build --target runtime -t wifi-sense:ci .
      - name: Verify non-root runtime and configuration
        run: |
          test "$(docker run --rm --entrypoint id wifi-sense:ci -u)" != 0
          docker run --rm wifi-sense:ci python -m wifisense.main --config /app/config.yaml --check-config
